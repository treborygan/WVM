[package]
name = "warehouse-visual-manager"
version = "0.1.10"
description = "Warehouse Visual Manager desktop shell"
authors = ["Warehouse Visual Manager contributors"]
edition = "2021"
rust-version = "1.90.0"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-fs = "=2.7.0"
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
