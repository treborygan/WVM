[package]
name = "warehouse-visual-manager"
version = "0.1.0"
description = "Warehouse Visual Manager desktop shell"
authors = ["Warehouse Visual Manager contributors"]
edition = "2021"
rust-version = "1.88.0"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.6", features = [] }

[dev-dependencies]
tempfile = "=3.27.0"
